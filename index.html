<html lang="es">
<head>
<meta charset="utf-8">

<title>Consola de la asamblea · Quórum, votos y votación por correo</title>
<!-- interfaz v11 -->
<style>
:root{
  --bg:#f2f4f8;--panel:#ffffff;--ink:#14213a;--muted:#5b6678;--line:#dde2ea;--accent:#1b5fd1;--accent-ink:#ffffff;
  --pres:#0f8a4f;--pres-bg:#dcf5e7;--rep:#6d3fd6;--rep-bg:#ece4fb;--aus:#8a94a6;--aus-bg:#eceff4;
  --fav:#0f8a4f;--con:#c22727;--abs:#b26a00;--vf:#2152e0;--vfbg:#e8eeff;--vc:#b4400d;--vcbg:#fdebdd;--vx:#475569;--vxbg:#e8ecf2;--warn-bg:#fff3d6;--warn:#8a5a00;--err-bg:#fde4e4;--shadow:0 1px 2px rgba(15,25,45,.07),0 6px 16px rgba(15,25,45,.05);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d131f;--panel:#171f2e;--ink:#e7ecf6;--muted:#9aa6bb;--line:#2a3549;--accent:#6c9bff;--accent-ink:#0b1220;
    --pres:#4ade80;--pres-bg:#12351f;--rep:#b79bff;--rep-bg:#2a2147;--aus:#8693a8;--aus-bg:#222b3b;
    --fav:#4ade80;--con:#ff7b7b;--abs:#fbbf24;--vf:#7fa2ff;--vfbg:#16234a;--vc:#ffa877;--vcbg:#3d2312;--vx:#c3cee0;--vxbg:#242e42;--warn-bg:#3a2d0c;--warn:#fcd34d;--err-bg:#3d1717;--shadow:0 1px 2px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d131f;--panel:#171f2e;--ink:#e7ecf6;--muted:#9aa6bb;--line:#2a3549;--accent:#6c9bff;--accent-ink:#0b1220;
  --pres:#4ade80;--pres-bg:#12351f;--rep:#b79bff;--rep-bg:#2a2147;--aus:#8693a8;--aus-bg:#222b3b;
  --fav:#4ade80;--con:#ff7b7b;--abs:#fbbf24;--vf:#7fa2ff;--vfbg:#16234a;--vc:#ffa877;--vcbg:#3d2312;--vx:#c3cee0;--vxbg:#242e42;--warn-bg:#3a2d0c;--warn:#fcd34d;--err-bg:#3d1717;--shadow:0 1px 2px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--panel)}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:780px;margin:0 auto;padding:0 12px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
header .wrap{padding-top:10px;padding-bottom:10px}
.hrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hrow select{flex:1;min-width:140px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px;font-weight:650}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:12px;background:var(--aus-bg);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--pres-bg);color:var(--pres)}.chip.warn{background:var(--warn-bg);color:var(--warn)}.chip.bad{background:var(--err-bg);color:var(--con)}.chip.rep{background:var(--rep-bg);color:var(--rep)}
.qbar{position:relative;height:16px;border-radius:999px;background:var(--aus-bg);overflow:hidden;margin:10px 0 6px;display:flex}
.qbar i{display:block;height:100%}.qbar .p{background:var(--pres)}.qbar .r{background:var(--rep)}
.qmark{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.qtxt{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:13px}
.qtxt b{font-size:19px;font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}
main{padding:14px 0 96px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
.card h2{margin:0 0 8px;font-size:16px}
.card h3{margin:12px 0 6px;font-size:14px}
.muted{color:var(--muted);font-size:13px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 14px;min-height:44px;cursor:pointer}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.small{min-height:36px;padding:6px 10px;font-size:13px}
.btn.danger{color:var(--con)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.field{display:flex;flex-direction:column;gap:4px;flex:1;min-width:150px}
.field label{font-size:12px;color:var(--muted)}
input[type=text],input[type=number],input[type=search],input[type=datetime-local],textarea,select{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 10px;min-height:42px;width:100%}
input:disabled,select:disabled,textarea:disabled{opacity:.6}
textarea{min-height:110px;font-family:ui-monospace,Consolas,monospace;font-size:12.5px}
.unit{border-top:1px solid var(--line);padding:10px 0}
.unit:first-child{border-top:0}
.unit .top{display:flex;gap:10px;align-items:center}
.unit .id{font-weight:700;min-width:56px}
.unit .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.unit .al{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;white-space:nowrap}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:6px;margin-top:8px}
.acts button{border:1px solid var(--line);background:var(--panel);border-radius:10px;min-height:44px;cursor:pointer;font-size:14px}
.acts button.P{border-color:var(--pres);color:var(--pres)}.acts button.R{border-color:var(--rep);color:var(--rep)}
.acts button:disabled{opacity:.45;cursor:not-allowed}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:8px}
.seg button{border:1px solid var(--line);background:var(--panel);border-radius:10px;min-height:44px;cursor:pointer;font-size:14px}
.seg button:disabled{opacity:.5;cursor:not-allowed}
.seg button.on.F{background:var(--vfbg);border-color:var(--vf);color:var(--vf);font-weight:650}
.seg button.on.C{background:var(--vcbg);border-color:var(--vc);color:var(--vc);font-weight:650}
.seg button.on.X{background:var(--vxbg);border-color:var(--vx);color:var(--vx);font-weight:650}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chips button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px}
.chips button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:600;font-size:12px}
.tw{overflow-x:auto}
.verdict{margin-top:10px;padding:10px 12px;border-radius:10px;font-weight:650}
.verdict.ok{background:var(--pres-bg);color:var(--pres)}.verdict.no{background:var(--err-bg);color:var(--con)}.verdict.wait{background:var(--aus-bg);color:var(--muted)}
.rbar{display:flex;height:14px;border-radius:999px;overflow:hidden;background:var(--aus-bg);margin:8px 0}
.rbar i{display:block;height:100%}.rbar .f{background:var(--vf)}.rbar .c{background:var(--vc)}.rbar .a{background:var(--vx)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav .wrap{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:2px;padding-top:6px;padding-bottom:6px}
nav button{padding:2px;border:0;background:transparent;border-radius:10px;min-height:48px;cursor:pointer;color:var(--muted);font-size:11.5px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
nav button b{font-size:18px;line-height:1}
nav button.on{background:var(--aus-bg);color:var(--ink);font-weight:650}
details summary{cursor:pointer;font-weight:600;padding:6px 0}
.g3{display:grid;grid-template-columns:64px minmax(0,1fr) 84px 38px;gap:6px;align-items:center;margin-bottom:6px}
.note{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:8px 10px;font-size:13px;margin:8px 0}
.note.bad{background:var(--err-bg);color:var(--con)}
.hide{display:none!important}
.ev{border-top:1px solid var(--line);padding:8px 0;font-size:13px}
.ev:first-child{border-top:0}
.ev .l{display:flex;gap:8px;align-items:baseline}
.ev .n{font-weight:700;min-width:34px;color:var(--muted)}
.ev .d{flex:1;min-width:0}
.ev .t{color:var(--muted);font-size:12px;white-space:nowrap}
.ev.an .d{text-decoration:line-through;color:var(--muted)}
.ev .m{color:var(--muted);font-size:12px;margin-top:2px;font-family:ui-monospace,Consolas,monospace}
.ov{position:fixed;inset:0;z-index:80;background:rgba(10,15,25,.55);display:flex;align-items:flex-end;justify-content:center;padding:12px}
@media (min-width:600px){.ov{align-items:center}}
.mbox{background:var(--panel);border-radius:16px;box-shadow:var(--shadow);padding:16px;width:100%;max-width:480px;max-height:90vh;overflow:auto}
.mbox h3{margin:0 0 6px;font-size:17px}
.mbox .fld{margin:8px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:76px;z-index:90;background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:999px;font-size:13px;max-width:92vw}
.spark{width:100%;height:60px}
.hash{font-family:ui-monospace,Consolas,monospace;font-size:13px;letter-spacing:.5px}
.photo{max-width:100%;border-radius:10px;border:1px solid var(--line)}
.addgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.err{color:var(--con);font-size:13px;margin-top:6px}
.prow{display:grid;grid-template-columns:70px minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.prow .pi{font-weight:700}.prow .pn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.prow .pa{color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px}
.prow .pb{grid-column:1/-1;display:flex;gap:8px}
.selbar{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:19;background:var(--panel);border-top:1px solid var(--line);box-shadow:0 -4px 14px rgba(15,25,45,.14)}
.selbar .wrap{padding-top:8px;padding-bottom:8px}
.selbar .seg{margin-top:6px}
.unit.sel{background:var(--aus-bg);border-radius:10px;padding-left:8px;padding-right:8px}
.cbx{width:26px;height:26px;accent-color:var(--accent);flex:none;cursor:pointer}
.paso{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--aus-bg);color:var(--muted);font-size:14px;font-weight:700}.paso.ok{background:var(--pres-bg);color:var(--pres)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:8px 0}.kpi{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px}.kpi b{display:block;font-size:22px;font-variant-numeric:tabular-nums}.kpi span{font-size:12px;color:var(--muted)}.kpi.warn{background:var(--warn-bg);color:var(--warn)}
.okline{background:var(--pres-bg);color:var(--pres);border-radius:10px;padding:8px 12px;margin:8px 0;font-weight:600;font-size:14px}
.crow{display:grid;grid-template-columns:54px minmax(90px,1fr) minmax(130px,1.2fr) minmax(130px,1.2fr);gap:6px;align-items:center;padding:5px 0;border-top:1px solid var(--line)}.crow .ci{font-weight:700}.crow .cn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}.crow input{min-height:38px;padding:6px 8px;font-size:13px}.crow input.mal{border-color:var(--con)}
@media (max-width:560px){.crow{grid-template-columns:48px 1fr}.crow input{grid-column:1/-1}}
.vrow{border-top:1px solid var(--line);padding:9px 0}.vrow .vn{margin-bottom:6px;font-size:14px}.via.sala{background:var(--aus-bg);color:var(--muted)}.via{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:999px;background:var(--rep-bg);color:var(--rep);font-size:12px;font-weight:600}
button{transition:transform .08s,filter .15s,background-color .15s,box-shadow .15s}
button:active:not(:disabled){transform:scale(.96);filter:brightness(.88)}
button.pulsado{animation:pulso .5s ease-out}
@keyframes pulso{0%{box-shadow:0 0 0 0 rgba(27,95,209,.55)}100%{box-shadow:0 0 0 14px rgba(27,95,209,0)}}
.btn.cargando{pointer-events:none;opacity:.8}
.btn.cargando::before{content:"";display:inline-block;width:14px;height:14px;margin-right:8px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:giro .7s linear infinite;vertical-align:-2px}
@keyframes giro{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){button.pulsado,.btn.cargando::before{animation:none}}
.toast{display:flex;align-items:center;gap:8px;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.toast.ok{background:#0f7a45;color:#fff}.toast.ok::before{content:"✓";font-weight:800}
.toast.err{background:#b42323;color:#fff}.toast.err::before{content:"!";font-weight:800;border:2px solid #fff;border-radius:50%;width:18px;height:18px;display:inline-grid;place-items:center;font-size:12px}
nav button{position:relative}nav .nn{position:absolute;top:1px;left:calc(50% - 24px);width:15px;height:15px;border-radius:50%;background:var(--aus-bg);color:var(--muted);font-size:10px;font-weight:700;display:grid;place-items:center}
nav button.on .nn{background:var(--accent);color:var(--accent-ink)}
#lock{position:fixed;inset:0;z-index:100;background:var(--bg);overflow:auto;display:none;align-items:center;justify-content:center;padding:20px}
body.bloqueado #lock{display:flex}
body.bloqueado>*:not(#lock):not(#modal):not(script):not(style){display:none!important}
body.bloqueado .ov{z-index:300}
#asmLock[hidden]{display:none}
.lockcard{background:var(--panel);border-radius:18px;box-shadow:var(--shadow);padding:22px;width:100%;max-width:400px}
.lockcard h1{font-size:22px;margin:0 0 6px;color:var(--ink)}
.lockcard .field{margin-top:12px}
.lockcard label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.lockcard input,.mbox .field input[type=password]{width:100%;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);box-sizing:border-box}
.lockcard .btn.primary{width:100%;margin-top:14px;min-height:46px}
.lockerr{color:var(--con);font-size:13.5px;min-height:20px;margin-top:8px}
.lockcard .small{font-size:12px;margin-top:14px}
.linkbtn{background:none;border:0;color:var(--accent);font-size:13.5px;padding:10px 0;cursor:pointer;text-decoration:underline}
.next{background:var(--panel);border:2px solid var(--accent);border-radius:16px;padding:14px 16px;margin-bottom:12px;display:flex;flex-direction:column;gap:6px}
.next .et{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.next h2{margin:0;font-size:18px;color:var(--ink)}.next p{margin:0;color:var(--muted);font-size:14px;line-height:1.5}
.next .row{margin-top:6px;gap:8px;flex-wrap:wrap}
#asmPantalla[hidden]{display:none}
:root{--bg:#f4f6fa;--ink:#0e1a33;--muted:#55627a;--line:#dde3ee;--accent:#2152e0;--shadow:0 1px 2px rgba(15,25,45,.06),0 10px 24px rgba(15,25,45,.06)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1328;--panel:#111c38;--ink:#eef2fa;--muted:#a9b6ce;--line:#22305c;--accent:#7fa2ff;--accent-ink:#0a1328;--shadow:0 1px 2px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#0a1328;--panel:#111c38;--ink:#eef2fa;--muted:#a9b6ce;--line:#22305c;--accent:#7fa2ff;--accent-ink:#0a1328}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
h1,h2,#asmSel,.next h2{font-family:"Space Grotesk",Inter,sans-serif}

/* ===== revisión de interfaz (v11): encabezado compacto, filas densas, dos paneles, avisos arriba ===== */
header{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px)}
main{padding-top:calc(var(--hh,150px) + 12px)}
header .wrap{transition:padding .15s}
header.mini .hrow{display:none}
header.mini .wrap{padding-top:6px;padding-bottom:6px}
header.mini .qbar{height:8px;margin:0 0 4px}
header.mini .qtxt{font-size:12.5px;flex-wrap:nowrap;overflow:hidden;white-space:nowrap}
header.mini .qtxt b{font-size:15px}
.hrow .btn.small{display:inline-flex;align-items:center;gap:6px}
.ico{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button b{display:grid;place-items:center;height:22px}nav button b .ico{width:22px;height:22px}
#toast .toast{left:12px;right:12px;transform:none;width:fit-content;max-width:calc(100vw - 24px);margin:0 auto;border-radius:16px;bottom:calc(72px + env(safe-area-inset-bottom,0px))}
.toast button{border:1px solid rgba(255,255,255,.55);background:transparent;color:inherit;border-radius:999px;padding:3px 12px;font-size:12.5px;font-weight:700;cursor:pointer;min-height:28px}
.next{flex-direction:row;align-items:center;flex-wrap:wrap;gap:6px 14px;padding:10px 16px;border-radius:16px;border-width:1.5px}
.next .tx{flex:1;min-width:220px;display:flex;flex-direction:column;gap:2px}
.next h2{font-size:16px}.next p{font-size:13px;line-height:1.4}.next .et{font-size:11px}
.next .row{margin-top:0}.next .btn.primary{min-height:40px;font-size:14px}
.unit.fila{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:center;padding:8px 0}
.unit.fila .top{grid-column:1/-1}
.unit.fila .st{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;min-width:0}
.unit.fila .acts{margin-top:0;display:flex;gap:6px}
.unit.fila .acts button{min-height:40px;padding:0 14px;font-size:13.5px;white-space:nowrap}
.unit.fila.unica{background:var(--pres-bg);border-radius:10px;padding-left:8px;padding-right:8px}
.kbd{display:inline-block;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:0 6px;font:600 12px ui-monospace,Consolas,monospace;background:var(--bg)}
.rwrap{position:relative;margin:8px 0}.rwrap .rbar{margin:0}
.rmark{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:1px}
.rleg{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-bottom:6px}.rleg i{display:inline-block;width:2px;height:12px;background:var(--ink)}
#view.estrecho>*{max-width:756px;margin-left:auto;margin-right:auto}
@media (min-width:700px){
  .unit.fila{grid-template-columns:64px minmax(0,1.1fr) 72px minmax(0,1.5fr) auto;padding:6px 0}
  .unit.fila .top{display:contents}
  .unit.fila .al{text-align:right}
