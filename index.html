<!-- interfaz v24 -->
<style>
:root{

  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d131f;--panel:#171f2e;--ink:#e7ecf6;--muted:#9aa6bb;--line:#2a3549;--accent:#6c9bff;--accent-ink:#0b1220;
    --pres:#4ade80;--pres-bg:#12351f;--rep:#b79bff;--rep-bg:#2a2147;--aus:#8693a8;--aus-bg:#222b3b;
    --fav:#4ade80;--con:#ff7b7b;--abs:#fbbf24;--vf:#7fa2ff;--vfbg:#16234a;--vc:#ffa877;--vcbg:#3d2312;--vx:#c3cee0;--vxbg:#242e42;--warn-bg:#3a2d0c;--warn:#fcd34d;--err-bg:#3d1717;--shadow:0 1px 2px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d131f;--panel:#171f2e;--ink:#e7ecf6;--muted:#9aa6bb;--line:#2a3549;--accent:#6c9bff;--accent-ink:#0b1220;
  --pres:#4ade80;--pres-bg:#12351f;--rep:#b79bff;--rep-bg:#2a2147;--aus:#8693a8;--aus-bg:#222b3b;
  --fav:#4ade80;--con:#ff7b7b;--abs:#fbbf24;--vf:#7fa2ff;--vfbg:#16234a;--vc:#ffa877;--vcbg:#3d2312;--vx:#c3cee0;--vxbg:#242e42;--warn-bg:#3a2d0c;--warn:#fcd34d;--err-bg:#3d1717;--shadow:0 1px 2px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--panel)}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:780px;margin:0 auto;padding:0 12px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
header .wrap{padding-top:10px;padding-bottom:10px}
.hrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hrow select{flex:1;min-width:140px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px;font-weight:650}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:12px;background:var(--aus-bg);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--pres-bg);color:var(--pres)}.chip.warn{background:var(--warn-bg);color:var(--warn)}.chip.bad{background:var(--err-bg);color:var(--con)}.chip.rep{background:var(--rep-bg);color:var(--rep)}
.qbar{position:relative;height:16px;border-radius:999px;background:var(--aus-bg);overflow:hidden;margin:10px 0 6px;display:flex}
.qbar i{display:block;height:100%}.qbar .p{background:var(--pres)}.qbar .r{background:var(--rep)}
.qmark{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.qtxt{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:13px}
.qtxt b{font-size:19px;font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}
main{padding:14px 0 96px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
.card h2{margin:0 0 8px;font-size:16px}
.card h3{margin:12px 0 6px;font-size:14px}
.muted{color:var(--muted);font-size:13px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 14px;min-height:44px;cursor:pointer}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.small{min-height:36px;padding:6px 10px;font-size:13px}
.btn.danger{color:var(--con)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.field{display:flex;flex-direction:column;gap:4px;flex:1;min-width:150px}
.field label{font-size:12px;color:var(--muted)}
input[type=text],input[type=number],input[type=search],input[type=datetime-local],textarea,select{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 10px;min-height:42px;width:100%}
input:disabled,select:disabled,textarea:disabled{opacity:.6}
textarea{min-height:110px;font-family:ui-monospace,Consolas,monospace;font-size:12.5px}
.unit{border-top:1px solid var(--line);padding:10px 0}
.unit:first-child{border-top:0}
.unit .top{display:flex;gap:10px;align-items:center}
.unit .id{font-weight:700;min-width:56px}
.unit .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.unit .al{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;white-space:nowrap}
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:6px;margin-top:8px}
.acts button{border:1px solid var(--line);background:var(--panel);border-radius:10px;min-height:44px;cursor:pointer;font-size:14px}
.acts button.P{border-color:var(--pres);color:var(--pres)}.acts button.R{border-color:var(--rep);color:var(--rep)}
.acts button:disabled{opacity:.45;cursor:not-allowed}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:8px}
.seg button{border:1px solid var(--line);background:var(--panel);border-radius:10px;min-height:44px;cursor:pointer;font-size:14px}
.seg button:disabled{opacity:.5;cursor:not-allowed}
.seg button.on.F{background:var(--vfbg);border-color:var(--vf);color:var(--vf);font-weight:650}
.seg button.on.C{background:var(--vcbg);border-color:var(--vc);color:var(--vc);font-weight:650}
.seg button.on.X{background:var(--vxbg);border-color:var(--vx);color:var(--vx);font-weight:650}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chips button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px}
.chips button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:600;font-size:12px}
.tw{overflow-x:auto}
.verdict{margin-top:10px;padding:10px 12px;border-radius:10px;font-weight:650}
.verdict.ok{background:var(--pres-bg);color:var(--pres)}.verdict.no{background:var(--err-bg);color:var(--con)}.verdict.wait{background:var(--aus-bg);color:var(--muted)}
.rbar{display:flex;height:14px;border-radius:999px;overflow:hidden;background:var(--aus-bg);margin:8px 0}
.rbar i{display:block;height:100%}.rbar .f{background:var(--vf)}.rbar .c{background:var(--vc)}.rbar .a{background:var(--vx)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav .wrap{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:2px;padding-top:6px;padding-bottom:6px}
nav button{padding:2px;border:0;background:transparent;border-radius:10px;min-height:48px;cursor:pointer;color:var(--muted);font-size:11.5px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
nav button b{font-size:18px;line-height:1}
nav button.on{background:var(--aus-bg);color:var(--ink);font-weight:650}
details summary{cursor:pointer;font-weight:600;padding:6px 0}
.g3{display:grid;grid-template-columns:64px minmax(0,1fr) 84px 38px;gap:6px;align-items:center;margin-bottom:6px}
.note{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:8px 10px;font-size:13px;margin:8px 0}
.note.bad{background:var(--err-bg);color:var(--con)}
.hide{display:none!important}
.ev{border-top:1px solid var(--line);padding:8px 0;font-size:13px}
.ev:first-child{border-top:0}
.ev .l{display:flex;gap:8px;align-items:baseline}
.ev .n{font-weight:700;min-width:34px;color:var(--muted)}
.ev .d{flex:1;min-width:0}
.ev .t{color:var(--muted);font-size:12px;white-space:nowrap}
.ev.an .d{text-decoration:line-through;color:var(--muted)}
.ev .m{color:var(--muted);font-size:12px;margin-top:2px;font-family:ui-monospace,Consolas,monospace}
.ov{position:fixed;inset:0;z-index:80;background:rgba(10,15,25,.55);display:flex;align-items:flex-end;justify-content:center;padding:12px}
@media (min-width:600px){.ov{align-items:center}}
.mbox{background:var(--panel);border-radius:16px;box-shadow:var(--shadow);padding:16px;width:100%;max-width:480px;max-height:90vh;overflow:auto}
.mbox h3{margin:0 0 6px;font-size:17px}
.mbox .fld{margin:8px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:76px;z-index:90;background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:999px;font-size:13px;max-width:92vw}
.spark{width:100%;height:60px}
.hash{font-family:ui-monospace,Consolas,monospace;font-size:13px;letter-spacing:.5px}
.photo{max-width:100%;border-radius:10px;border:1px solid var(--line)}
.addgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.err{color:var(--con);font-size:13px;margin-top:6px}
.prow{display:grid;grid-template-columns:70px minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.prow .pi{font-weight:700}.prow .pn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.prow .pa{color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px}
.prow .pb{grid-column:1/-1;display:flex;gap:8px}
.selbar{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:19;background:var(--panel);border-top:1px solid var(--line);box-shadow:0 -4px 14px rgba(15,25,45,.14)}
.selbar .wrap{padding-top:8px;padding-bottom:8px}
.selbar .seg{margin-top:6px}
.unit.sel{background:var(--aus-bg);border-radius:10px;padding-left:8px;padding-right:8px}
.cbx{width:26px;height:26px;accent-color:var(--accent);flex:none;cursor:pointer}
.paso{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--aus-bg);color:var(--muted);font-size:14px;font-weight:700}.paso.ok{background:var(--pres-bg);color:var(--pres)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:8px 0}.kpi{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px}.kpi b{display:block;font-size:22px;font-variant-numeric:tabular-nums}.kpi span{font-size:12px;color:var(--muted)}.kpi.warn{background:var(--warn-bg);color:var(--warn)}
.okline{background:var(--pres-bg);color:var(--pres);border-radius:10px;padding:8px 12px;margin:8px 0;font-weight:600;font-size:14px}
.crow{display:grid;grid-template-columns:54px minmax(90px,1fr) minmax(130px,1.2fr) minmax(130px,1.2fr);gap:6px;align-items:center;padding:5px 0;border-top:1px solid var(--line)}.crow .ci{font-weight:700}.crow .cn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}.crow input{min-height:38px;padding:6px 8px;font-size:13px}.crow input.mal{border-color:var(--con)}
@media (max-width:560px){.crow{grid-template-columns:48px 1fr}.crow input{grid-column:1/-1}}
.vrow{border-top:1px solid var(--line);padding:9px 0}.vrow .vn{margin-bottom:6px;font-size:14px}.via.sala{background:var(--aus-bg);color:var(--muted)}.via{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:999px;background:var(--rep-bg);color:var(--rep);font-size:12px;font-weight:600}
button{transition:transform .08s,filter .15s,background-color .15s,box-shadow .15s}
button:active:not(:disabled){transform:scale(.96);filter:brightness(.88)}
button.pulsado{animation:pulso .5s ease-out}
@keyframes pulso{0%{box-shadow:0 0 0 0 rgba(27,95,209,.55)}100%{box-shadow:0 0 0 14px rgba(27,95,209,0)}}
.btn.cargando{pointer-events:none;opacity:.8}
.btn.cargando::before{content:"";display:inline-block;width:14px;height:14px;margin-right:8px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:giro .7s linear infinite;vertical-align:-2px}
@keyframes giro{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){button.pulsado,.btn.cargando::before{animation:none}}
.toast{display:flex;align-items:center;gap:8px;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.toast.ok{background:#0f7a45;color:#fff}.toast.ok::before{content:"✓";font-weight:800}
.toast.err{background:#b42323;color:#fff}.toast.err::before{content:"!";font-weight:800;border:2px solid #fff;border-radius:50%;width:18px;height:18px;display:inline-grid;place-items:center;font-size:12px}
nav button{position:relative}nav .nn{position:absolute;top:1px;left:calc(50% - 24px);width:15px;height:15px;border-radius:50%;background:var(--aus-bg);color:var(--muted);font-size:10px;font-weight:700;display:grid;place-items:center}
nav button.on .nn{background:var(--accent);color:var(--accent-ink)}
#lock{position:fixed;inset:0;z-index:100;background:var(--bg);overflow:auto;display:none;align-items:center;justify-content:center;padding:20px}
body.bloqueado #lock{display:flex}
body.bloqueado>*:not(#lock):not(#modal):not(script):not(style){display:none!important}
body.bloqueado .ov{z-index:300}
#asmLock[hidden]{display:none}
.lockcard{background:var(--panel);border-radius:18px;box-shadow:var(--shadow);padding:22px;width:100%;max-width:400px}
.lockcard h1{font-size:22px;margin:0 0 6px;color:var(--ink)}
.lockcard .field{margin-top:12px}
.lockcard label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.lockcard input,.mbox .field input[type=password]{width:100%;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);box-sizing:border-box}
.lockcard .btn.primary{width:100%;margin-top:14px;min-height:46px}
.lockerr{color:var(--con);font-size:13.5px;min-height:20px;margin-top:8px}
.lockcard .small{font-size:12px;margin-top:14px}
.linkbtn{background:none;border:0;color:var(--accent);font-size:13.5px;padding:10px 0;cursor:pointer;text-decoration:underline}
.next{background:var(--panel);border:2px solid var(--accent);border-radius:16px;padding:14px 16px;margin-bottom:12px;display:flex;flex-direction:column;gap:6px}
.next .et{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.next h2{margin:0;font-size:18px;color:var(--ink)}.next p{margin:0;color:var(--muted);font-size:14px;line-height:1.5}
.next .row{margin-top:6px;gap:8px;flex-wrap:wrap}
#asmPantalla[hidden]{display:none}
:root{--bg:#f4f6fa;--ink:#0e1a33;--muted:#55627a;--line:#dde3ee;--accent:#2152e0;--shadow:0 1px 2px rgba(15,25,45,.06),0 10px 24px rgba(15,25,45,.06)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1328;--panel:#111c38;--ink:#eef2fa;--muted:#a9b6ce;--line:#22305c;--accent:#7fa2ff;--accent-ink:#0a1328;--shadow:0 1px 2px rgba(0,0,0,.4)}}

body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}

/* ===== revisión de interfaz (v11): encabezado compacto, filas densas, dos paneles, avisos arriba ===== */
header{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px)}
main{padding-top:calc(var(--hh,150px) + 12px)}
header .wrap{transition:padding .15s}

header.mini .wrap{padding-top:6px;padding-bottom:6px}

.kbd{display:inline-block;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:0 6px;font:600 12px ui-monospace,Consolas,monospace;background:var(--bg)}

#view.estrecho>*{max-width:756px;margin-left:auto;margin-right:auto}

@media (max-width:600px){

/* ===== v12: opción múltiple, orden del día, escáner ===== */
:root{--o1:#2152e0;--o2:#b4400d;--o3:#0f766e;--o4:#7c3aed;--o5:#a16207;--o6:#be185d;--o1b:#e8eeff;--o2b:#fdebdd;--o3b:#dff5f1;--o4b:#efe7fe;--o5b:#fbf1d6;--o6b:#fce7f0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--o1:#7fa2ff;--o2:#ffa877;--o3:#5eead4;--o4:#c4a8ff;--o5:#fbbf24;--o6:#f9a8d4;--o1b:#16234a;--o2b:#3d2312;--o3b:#0f3a36;--o4b:#2a2147;--o5b:#3a2d0c;--o6b:#3d1630}}
:root[data-theme="dark"]{--o1:#7fa2ff;--o2:#ffa877;--o3:#5eead4;--o4:#c4a8ff;--o5:#fbbf24;--o6:#f9a8d4;--o1b:#16234a;--o2b:#3d2312;--o3b:#0f3a36;--o4b:#2a2147;--o5b:#3a2d0c;--o6b:#3d1630}
.seg button.on.O1{background:var(--o1b);border-color:var(--o1);color:var(--o1);font-weight:650}.seg button.on.O2{background:var(--o2b);border-color:var(--o2);color:var(--o2);font-weight:650}.seg button.on.O3{background:var(--o3b);border-color:var(--o3);color:var(--o3);font-weight:650}.seg button.on.O4{background:var(--o4b);border-color:var(--o4);color:var(--o4);font-weight:650}.seg button.on.O5{background:var(--o5b);border-color:var(--o5);color:var(--o5);font-weight:650}.seg button.on.O6{background:var(--o6b);border-color:var(--o6);color:var(--o6);font-weight:650}
.seg.m{grid-template-columns:repeat(auto-fit,minmax(104px,1fr))}
.seg button{overflow:hidden;text-overflow:ellipsis;padding:0 8px}.seg.m button{white-space:normal;line-height:1.2;padding:4px 8px}
@media (min-width:700px){.unit.vfila.m{grid-template-columns:minmax(0,1fr) minmax(300px,50%)}}
.plan-row{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.plan-row .pi{font-weight:700;color:var(--muted)}.plan-row .ac{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
@media (max-width:560px){.plan-row{grid-template-columns:26px minmax(0,1fr)}.plan-row .ac{grid-column:1/-1;justify-content:flex-start}}
.qrlog{max-height:150px;overflow:auto;margin-top:8px;font-size:13px}.qrlog div{padding:4px 0;border-top:1px solid var(--line)}.qrlog .bad{color:var(--con)}

/* ===== v13: elegir cómo se vota ===== */
.modos{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
@media (max-width:620px){.modos{grid-template-columns:1fr}}
.modo{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:14px;border:2px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);font:inherit;cursor:pointer;min-height:96px}
.modo:hover{border-color:var(--muted)}.modo.on{border-color:var(--vf);background:var(--vfbg)}
.modo .mi{flex:none;color:var(--muted)}.modo.on .mi{color:var(--vf)}
.modo .mt{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}.modo .mt b{font-size:16px}.modo .mt span{font-size:13.5px;color:var(--muted);line-height:1.4}
ol.ayuda{margin:8px 0 0;padding-left:20px;display:grid;gap:6px;font-size:14px;line-height:1.45}

/* ===== v14: tema moderno ===== */
:root{--brand:#4f46e5;--brand2:#0891b2;--brand-soft:#eef0ff;--hdr1:#1b2160;--hdr2:#3730a3;--ring:rgba(79,70,229,.32);--bg:#f3f5fb;--line:#e3e7f1;--shadow:0 1px 2px rgba(20,30,80,.06),0 8px 24px rgba(20,30,80,.07);--accent:#4f46e5;--accent-ink:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--brand:#8b8cf8;--brand2:#22d3ee;--brand-soft:#1b1f40;--hdr1:#0b1030;--hdr2:#1c1f5e;--ring:rgba(139,140,248,.4);--bg:#0b1020;--panel:#141a2e;--line:#27304a;--accent:#8b8cf8;--accent-ink:#0b1020}}
:root[data-theme="dark"]{--brand:#8b8cf8;--brand2:#22d3ee;--brand-soft:#1b1f40;--hdr1:#0b1030;--hdr2:#1c1f5e;--ring:rgba(139,140,248,.4);--bg:#0b1020;--panel:#141a2e;--line:#27304a;--accent:#8b8cf8;--accent-ink:#0b1020}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
.card h2,.next h2,.mbox h3,.modo .mt b,.qr-hero .qt b{font-family:"Space Grotesk",Inter,sans-serif;letter-spacing:-.01em}
/* encabezado */
header{background:linear-gradient(135deg,var(--hdr1),var(--hdr2) 70%,#0e7490);color:#fff;border-bottom:0;box-shadow:0 8px 28px rgba(20,24,90,.38)}
body::before{background:var(--hdr1)}
header .hrow select{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);color:#fff;font-family:"Space Grotesk",Inter,sans-serif;font-size:16px;border-radius:12px}
header .hrow select option{color:#14213a;background:#fff}
header .hrow .btn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3);color:#fff;box-shadow:none}
header .hrow .btn:hover:not(:disabled){background:rgba(255,255,255,.22);color:#fff;border-color:rgba(255,255,255,.5)}
header .chip{background:rgba(255,255,255,.14);color:#e6e9ff}
header .chip.ok{background:rgba(52,211,153,.22);color:#a7f3d0}header .chip.warn{background:rgba(251,191,36,.24);color:#fde68a}header .chip.bad{background:rgba(248,113,113,.28);color:#fecaca}header .chip.rep{background:rgba(196,181,253,.24);color:#ddd6fe}
header #asmCerrar{background:#fff;border-color:#fff;color:#2b2f8a;font-weight:700}header #asmCerrar:hover:not(:disabled){background:#eef0ff;color:#1b2160}
.qbar{background:rgba(255,255,255,.18);height:14px}
.qbar .p{background:linear-gradient(90deg,#34d399,#10b981)}.qbar .r{background:linear-gradient(90deg,#c4b5fd,#a78bfa)}
.qmark{background:#fff;box-shadow:0 0 0 2px rgba(0,0,0,.28)}
header .qtxt{color:#e6e9ff}header .qtxt b{color:#fff;font-size:22px;font-family:"Space Grotesk",Inter,sans-serif}
/* tarjetas y botones */
.card{border-radius:18px;padding:16px 18px}
.card h2{font-size:18px}
.btn{border-radius:12px;font-weight:600;transition:transform .12s,box-shadow .15s,border-color .15s,background-color .15s,filter .15s}
.btn:hover:not(:disabled){border-color:var(--brand);color:var(--brand)}
.btn.primary{background:linear-gradient(135deg,var(--brand),#6366f1);border-color:transparent;color:#fff;box-shadow:0 6px 16px rgba(79,70,229,.3)}
.btn.primary:hover:not(:disabled){color:#fff;filter:brightness(1.07);transform:translateY(-1px);box-shadow:0 10px 22px rgba(79,70,229,.38)}
.btn.danger:hover:not(:disabled){border-color:var(--con);color:var(--con)}
input[type=text]:focus,input[type=number]:focus,input[type=search]:focus,input[type=password]:focus,input[type=datetime-local]:focus,textarea:focus,select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--ring)}
input[type=text],input[type=number],input[type=search],input[type=password],input[type=datetime-local],textarea,select{border-radius:12px}
.card input[type=password]{border:1px solid var(--line);background:var(--bg);padding:9px 10px;min-height:42px;width:100%}
.chips button{transition:background-color .15s,border-color .15s}.chips button:hover{border-color:var(--brand)}
.chips button.on{background:linear-gradient(135deg,var(--brand),#6366f1);border-color:transparent;color:#fff}
.kpi{background:var(--panel);border-radius:14px;box-shadow:var(--shadow)}.kpi b{font-family:"Space Grotesk",Inter,sans-serif}
.verdict{border-radius:12px}.okline{border-radius:12px}.note{border-radius:12px}
.paso{background:var(--brand-soft);color:var(--brand)}.paso.ok{background:var(--pres-bg);color:var(--pres)}
/* filas de asistencia */
.unit.fila{border-radius:12px}.unit.fila:hover{background:var(--bg)}
.unit .id{font-family:"Space Grotesk",Inter,sans-serif;font-size:16px;color:var(--brand)}
.acts button{border-radius:10px;font-weight:600}
.acts button.P{background:var(--pres-bg);border-color:transparent;color:var(--pres)}.acts button.P:hover:not(:disabled){background:var(--pres);color:#fff}
.acts button.R{background:var(--rep-bg);border-color:transparent;color:var(--rep)}.acts button.R:hover:not(:disabled){background:var(--rep);color:#fff}
.seg button{border-radius:10px;font-weight:600}.seg button:hover:not(:disabled){border-color:var(--brand)}
/* siguiente paso */
.next{background:linear-gradient(135deg,var(--brand-soft),var(--panel));border:1px solid var(--ring);border-left:5px solid var(--brand);border-radius:16px;box-shadow:var(--shadow)}
.next .et{color:var(--brand);font-weight:700;letter-spacing:.05em}
/* barra inferior flotante */
nav{background:transparent;border:0;pointer-events:none;padding:0 8px calc(8px + env(safe-area-inset-bottom,0px))}
nav .wrap{pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:0 12px 34px rgba(20,30,90,.24);padding:6px;max-width:760px}
nav button{border-radius:16px;min-height:52px;transition:background-color .15s,color .15s}nav button:hover{color:var(--brand)}
nav button.on{background:linear-gradient(135deg,var(--brand),#6366f1);color:#fff;box-shadow:0 6px 14px rgba(79,70,229,.35)}
@media (max-width:430px){nav button{font-size:10.5px;padding:2px 0}nav .wrap{gap:0;padding:5px 4px}}
nav button .nn{background:var(--brand-soft);color:var(--brand)}nav button.on .nn{background:#fff;color:var(--brand)}
main{padding-bottom:112px}.selbar{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
#toast .toast{background:rgba(20,25,60,.95);border:1px solid rgba(255,255,255,.16);color:#fff;border-radius:14px;box-shadow:0 12px 30px rgba(10,14,50,.35);bottom:calc(94px + env(safe-area-inset-bottom,0px))}
.ov{backdrop-filter:blur(3px)}.mbox{border-radius:22px;box-shadow:0 24px 60px rgba(10,14,50,.4)}
#lock{background:linear-gradient(135deg,var(--hdr1),var(--hdr2) 70%,#0e7490)}.lockcard{border-radius:24px;box-shadow:0 24px 60px rgba(10,14,50,.45);padding:26px}
.modo{border-radius:16px}.modo.on{border-color:var(--brand);background:var(--brand-soft)}.modo.on .mi{color:var(--brand)}
/* botón principal del escáner QR */
.qr-hero{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;border-radius:18px;padding:14px 16px;margin:0 0 14px;cursor:pointer;color:#fff;background:linear-gradient(120deg,#0d9488 0%,#4f46e5 100%);box-shadow:0 12px 28px rgba(79,70,229,.4);position:relative;overflow:hidden;min-height:78px}
.qr-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.26) 50%,transparent 70%);transform:translateX(-120%);animation:brillo 3.6s ease-in-out infinite;pointer-events:none}
@keyframes brillo{0%,55%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
.qr-hero .qi{flex:none;width:54px;height:54px;border-radius:15px;background:rgba(255,255,255,.22);display:grid;place-items:center}
.qr-hero .qi svg{width:32px;height:32px;stroke:#fff;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.qr-hero .qt{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}.qr-hero .qt b{font-size:19px}.qr-hero .qt span{font-size:13.5px;opacity:.94;line-height:1.35}
.qr-hero .qg{font-size:30px;line-height:1;opacity:.9}
.qr-hero:hover{filter:brightness(1.08);transform:translateY(-1px);box-shadow:0 16px 34px rgba(79,70,229,.48)}
@media (prefers-reduced-motion:reduce){.qr-hero::after{animation:none}}
.qr-frame{position:relative;border-radius:18px;overflow:hidden;background:#000;margin:8px 0}
.qr-frame video{display:block;width:100%;max-height:48vh;min-height:200px;object-fit:cover}
.qr-frame::before{content:"";position:absolute;inset:14% 18%;border-radius:20px;border:3px solid rgba(255,255,255,.92);box-shadow:0 0 0 999px rgba(0,0,0,.4);pointer-events:none;z-index:1}
.qr-line{position:absolute;left:20%;right:20%;height:3px;border-radius:2px;background:linear-gradient(90deg,transparent,#34d399,transparent);top:18%;z-index:2;animation:escaneo 2.2s ease-in-out infinite}
@keyframes escaneo{0%,100%{top:18%}50%{top:78%}}
@media (prefers-reduced-motion:reduce){.qr-line{animation:none;top:50%}}

/* ===== v15: cómo votará cada propietario ===== */
.rbar3{display:flex;height:16px;border-radius:999px;overflow:hidden;background:var(--aus-bg);margin:10px 0 4px}
.rbar3 i{display:block;height:100%}.v-correo{background:var(--brand)}.v-wa{background:#22c55e}.v-mesa{background:#94a3b8}
.via-row{display:flex;gap:12px;padding:11px 0;border-top:1px solid var(--line);align-items:flex-start}.via-row:first-of-type{border-top:0}
.vdot{flex:none;width:14px;height:14px;border-radius:50%;margin-top:5px}
.vtx{display:flex;flex-direction:column;gap:2px;font-size:14px;line-height:1.4}.vtx b{font-size:15px}

/* ===== v16: propietarios y correos en una sola lista ===== */
.prop-list{border:1px solid var(--line);border-radius:14px;overflow:auto;max-height:560px;background:var(--panel)}
.prop-row{display:grid;grid-template-columns:54px minmax(100px,.9fr) minmax(190px,1.7fr);gap:6px 10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line);border-left:4px solid transparent}
.prop-row:first-child{border-top:0}.prop-row.malo{border-left-color:var(--con);background:var(--err-bg)}.prop-row.revisar{border-left-color:#f59e0b;background:var(--warn-bg)}
.prop-row .pr-id{font-family:"Space Grotesk",Inter,sans-serif;font-weight:700;color:var(--brand)}
.prop-row .pr-n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prop-row .pr-mail{display:flex;flex-direction:column;gap:6px}.prop-row .pr-mail input{min-height:38px;padding:6px 10px;font-size:13.5px}
.prop-row .pr-info{grid-column:2/-1;display:flex;gap:6px 8px;flex-wrap:wrap;align-items:center}
.prop-row .pr-motivo{grid-column:2/-1;font-size:12.5px;color:var(--muted)}
.linkbtn{border:0;background:transparent;color:var(--muted);font-weight:600;cursor:pointer;padding:4px 2px;font-size:12.5px;text-decoration:underline}.linkbtn:hover{color:var(--brand)}
.chip.via-c{background:var(--brand-soft);color:var(--brand)}.chip.via-w{background:var(--pres-bg);color:var(--pres)}
@media (max-width:620px){.prop-row{grid-template-columns:44px 1fr}.prop-row .pr-mail,.prop-row .pr-info,.prop-row .pr-motivo{grid-column:1/-1}}

/* ===== v17: asistente «Nueva votación» ===== */
.btn.big{min-height:54px;font-size:17px;padding:12px 20px}
.mbox.nv{max-width:600px}.nv h3{font-family:"Space Grotesk",Inter,sans-serif;font-size:24px;margin-bottom:4px}
.nv .paso-t{display:flex;gap:10px;align-items:center;font-weight:700;font-size:17px;margin:16px 0 8px}
.nv .paso-t i{flex:none;width:28px;height:28px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-style:normal;font-size:14px}
.nv input[type=text]{font-size:18px;min-height:52px}
.nv-tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media (max-width:520px){.nv-tiles{grid-template-columns:1fr}}
.nv-tile{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:14px;border:2px solid var(--line);border-radius:16px;background:var(--panel);text-align:left;cursor:pointer;min-height:118px;color:var(--ink)}
.nv-tile:hover{border-color:var(--muted)}.nv-tile.on{border-color:var(--brand);background:var(--brand-soft)}
.nv-tile b{font-size:17px;font-family:"Space Grotesk",Inter,sans-serif}.nv-tile .s{font-size:13.5px;color:var(--muted);line-height:1.35}
.nv-ic svg{width:30px;height:30px;stroke:var(--brand);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nv-ops{margin-top:4px}.nv-op{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.nv-op .let{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;font-size:16px}
.nv-pt{font-size:13px;color:var(--muted);margin:14px 0 6px}
.nv-prev{display:grid;gap:6px}.nv-pv{display:flex;gap:12px;align-items:center;border:2px solid var(--line);border-radius:14px;padding:8px 12px;font-weight:700;font-size:15px}
.nv-pe{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--muted);font-size:14px}
.nv-pv.F{border-color:var(--vf);background:var(--vfbg)}.nv-pv.F .nv-pe{background:var(--vf)}.nv-pv.C{border-color:var(--vc);background:var(--vcbg)}.nv-pv.C .nv-pe{background:var(--vc)}.nv-pv.X{border-color:var(--vx);background:var(--vxbg)}.nv-pv.X .nv-pe{background:var(--vx)}
.nv-pv.O1{border-color:var(--o1);background:var(--o1b)}.nv-pv.O1 .nv-pe{background:var(--o1)}.nv-pv.O2{border-color:var(--o2);background:var(--o2b)}.nv-pv.O2 .nv-pe{background:var(--o2)}.nv-pv.O3{border-color:var(--o3);background:var(--o3b)}.nv-pv.O3 .nv-pe{background:var(--o3)}.nv-pv.O4{border-color:var(--o4);background:var(--o4b)}.nv-pv.O4 .nv-pe{background:var(--o4)}.nv-pv.O5{border-color:var(--o5);background:var(--o5b)}.nv-pv.O5 .nv-pe{background:var(--o5)}.nv-pv.O6{border-color:var(--o6);background:var(--o6b)}.nv-pv.O6 .nv-pe{background:var(--o6)}
.nv-pie{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.nv-pie .btn.big{flex:1 1 220px}

/* ===== v18: asistentes paso a paso ===== */
.wz-prog{display:flex;align-items:center;gap:10px;margin:6px 0 4px}.wz-dots{display:flex;gap:6px}
.wz-dots i{display:block;width:28px;height:8px;border-radius:99px;background:var(--aus-bg)}.wz-dots i.on{background:var(--brand)}.wz-dots i.ok{background:var(--pres)}
.wz-q{font-family:"Space Grotesk",Inter,sans-serif;font-weight:700;font-size:22px;margin:10px 0 2px;line-height:1.25}
.wz-body{margin-top:8px}.wz-body input[type=text],.wz-body select{font-size:19px;min-height:54px}.wz-body textarea{min-height:170px;font-size:14px}
.wz-sug{display:grid;gap:6px;margin-top:8px}.wz-sug .btn{text-align:left;display:block;min-height:46px}
.wz-resumen{display:grid;gap:8px;background:var(--bg);border-radius:14px;padding:12px 14px;margin-bottom:10px}.wz-resumen div{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.wz-resumen b{text-align:right}

/* ===== v19: entrega al terminar, dónde se guarda, NotebookLM ===== */
.ck-row{display:grid;grid-template-columns:auto 1fr auto;gap:10px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}.ck-row.dis{opacity:.55}
@media (max-width:560px){.ck-row{grid-template-columns:auto 1fr}.ck-row>div:last-child{grid-column:2}}
.don-row{display:grid;gap:3px;padding:11px 0;border-top:1px solid var(--line);font-size:14px;line-height:1.45}.don-row b{font-size:15px}

/* ===== v22: alarma de propietarios sin correo ===== */
@keyframes alarma{0%,100%{box-shadow:0 0 0 0 rgba(245,158,11,0),0 0 0 0 rgba(245,158,11,0);background-color:rgba(245,158,11,.06)}50%{box-shadow:0 0 18px 5px rgba(245,158,11,.60),0 0 0 3px rgba(245,158,11,.45);background-color:rgba(245,158,11,.18)}}
@keyframes alarma-punto{0%,100%{box-shadow:0 0 0 0 rgba(245,158,11,.8);opacity:1}50%{box-shadow:0 0 0 9px rgba(245,158,11,0);opacity:.5}}
.via-row.alerta{border-radius:14px;padding:12px 14px;margin:4px -6px;border:1px solid rgba(245,158,11,.55);animation:alarma 1.7s ease-in-out infinite}
.alarma-txt{margin-top:6px;padding:8px 10px;border-radius:10px;background:var(--warn-bg);color:var(--warn);font-size:13.5px;line-height:1.4}
nav button{position:relative}.alarma-dot{position:absolute;top:3px;right:calc(50% - 26px);width:11px;height:11px;border-radius:50%;background:#f59e0b;animation:alarma-punto 1.5s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.via-row.alerta{animation:none;box-shadow:0 0 0 3px rgba(245,158,11,.5)}.alarma-dot{animation:none}}

/* ===== v23: alarma roja de correos con problema ===== */
@keyframes alarma-roja{0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,0),0 0 0 0 rgba(220,38,38,0);background-color:rgba(220,38,38,.05)}50%{box-shadow:0 0 18px 5px rgba(220,38,38,.55),0 0 0 3px rgba(220,38,38,.40);background-color:rgba(220,38,38,.14)}}
@keyframes alarma-punto-roja{0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,.85);opacity:1}50%{box-shadow:0 0 0 9px rgba(220,38,38,0);opacity:.5}}
.via-row.alerta.rojo{border-color:rgba(220,38,38,.6);animation-name:alarma-roja}
.alarma-txt.rojo{background:var(--err-bg);color:var(--con)}
.alarma-dot.rojo{background:#dc2626;animation-name:alarma-punto-roja}
@media (prefers-reduced-motion:reduce){.via-row.alerta.rojo{animation:none;box-shadow:0 0 0 3px rgba(220,38,38,.5)}}

/* ===== v24: filas de asistencia en dos líneas (el estado nunca se monta sobre los botones) ===== */
@media (min-width:700px){
  .unit.fila{grid-template-columns:56px minmax(0,1fr) 72px 236px;grid-template-areas:"id nm al ac" ". st st ac";gap:4px 12px;padding:8px 0;align-items:center}
  .unit.fila .id{grid-area:id}.unit.fila .nm{grid-area:nm}.unit.fila .al{grid-area:al;text-align:right}
  .unit.fila .st{grid-area:st;min-width:0}.unit.fila .acts{grid-area:ac;align-self:center;justify-self:end;margin-top:0}
}
.unit.fila .st .chip{white-space:normal;line-height:1.3;max-width:100%}
